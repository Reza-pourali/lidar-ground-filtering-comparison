[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-ground-filter"
version = "0.1.0"
description = "Grid-based LiDAR ground filtering and documented workflow comparison."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "laspy>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]
